
- name: Enable mysql 8 X version
  command: dnf module enable mysql:8.4 -y

- name: Install Mysql server
  package:
    name: mysql-server
    state: present

- name: Start service and enable
  service:
    name: mysqld
    state: started
    enabled: yes     

- name: Install boto3 and botocore via pip in mysql
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    state: present
    executable: pip3.9    

- name: set root password
  command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
